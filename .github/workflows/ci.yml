name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Run ruff and auto-fix
        run: |
          # Apply automatic fixes where possible. Allow non-zero so we can inspect changes in the next step.
          ruff check . --fix || true
      - name: Fail if ruff produced changes (please commit fixes)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ruff made fixes. Run 'ruff check . --fix' locally, commit the changes, and push."
            git --no-pager diff
            exit 1
          fi
      - run: pytest
